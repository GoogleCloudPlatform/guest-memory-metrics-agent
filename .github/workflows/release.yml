name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-amd64
          - os: ubuntu-24.04-arm
            arch: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref }}

      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@v3

      - name: Run tests
        run: |
          bazel test //...

      - name: Build static binary
        run: |
          bazel build -c opt --features=fully_static_link //:kernel_metrics_agent
          cp bazel-bin/kernel_metrics_agent kernel_metrics_agent-${{ matrix.arch }}
          chmod +x kernel_metrics_agent-${{ matrix.arch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_metrics_agent-${{ matrix.arch }}
          path: kernel_metrics_agent-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true

      - name: Prepare release assets and generate checksums
        run: |
          sha256sum kernel_metrics_agent-linux-amd64 kernel_metrics_agent-linux-arm64 guest-memory-metrics-agent.service > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kernel_metrics_agent-linux-amd64
            kernel_metrics_agent-linux-arm64
            guest-memory-metrics-agent.service
            SHA256SUMS.txt
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true

